<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Equine Biosecurity Risk Calculator — EUnetHorse</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#00755F;--teal-deep:#0B2E24;--lime:#92B93B;--cream:#F5F7F0;--paper:#FFF;--ink:#12281F;--ink-soft:#4E6459;--line:#D9E0D0;--safe:#00755F;--safe-bg:#DCEEE6;--warn:#C8862B;--warn-bg:#F5E9D3;--danger:#B23B32;--danger-bg:#F3DEDA;--monitor:#D4A017;--monitor-bg:#FFF8E1;--info:#2563EB;--info-bg:#DBEAFE}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Source Sans 3',sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}
.topbar{background:var(--teal-deep);padding:10px 0}
.topbar-inner{max-width:960px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;color:#BFD6C9;gap:8px;flex-wrap:wrap}
header{padding:20px 0 14px;border-bottom:3px solid var(--teal);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo-img{height:56px;width:auto}
.title-block h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(18px,2.5vw,24px);margin:0;color:var(--teal-deep);line-height:1.1}
.title-block p{margin:3px 0 0;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.lang-wrap{display:flex;align-items:center;gap:6px}
.lang-wrap label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
select#langSelect{font-size:13px;padding:4px 6px;border-radius:4px;border:1px solid var(--teal);background:var(--paper);color:var(--ink)}
.intro-card{background:var(--paper);border:1.5px solid var(--line);border-left:4px solid var(--lime);border-radius:6px;padding:14px 16px;margin:20px 0 24px;font-size:13px;line-height:1.5;color:var(--ink-soft)}
.intro-card strong{color:var(--teal-deep)}
.section-title{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 24px}
.field label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:3px;padding:8px;font-family:'Source Sans 3',sans-serif;font-size:14px;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--lime);outline-offset:1px;border-color:var(--teal)}
/* Progress bar */
.progress-wrap{margin:20px 0;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:14px 16px}
.progress-bar-bg{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));border-radius:4px;transition:width .4s ease}
.progress-text{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between}
/* Category navigation */
.cat-nav{display:flex;gap:0;margin:0 0 4px;border-bottom:1.5px solid var(--line);flex-wrap:wrap;overflow-x:auto}
.cat-btn{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.03em;text-transform:uppercase;font-weight:600;padding:10px 12px 8px;background:none;border:none;border-bottom:3px solid transparent;color:var(--ink-soft);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;transition:all .2s}
.cat-btn.active{color:var(--teal-deep);border-bottom-color:var(--lime)}
.cat-btn.done{color:var(--safe)}
.cat-btn .cat-icon{font-size:13px}
.cat-btn .cat-check{font-size:10px;color:var(--safe)}
/* Question cards */
.cat-panel{display:none}
.cat-panel.active{display:block}
.question-card{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:12px;transition:border-color .2s}
.question-card:hover{border-color:var(--teal)}
.question-card.answered{border-left:4px solid var(--lime)}
.q-number{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:4px}
.q-text{font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:600;color:var(--teal-deep);margin-bottom:10px;line-height:1.4}
.q-help{font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.4;font-style:italic}
.q-options{display:flex;flex-direction:column;gap:6px}
.q-option{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border:1.5px solid var(--line);border-radius:4px;cursor:pointer;transition:all .2s;font-size:14px;line-height:1.4}
.q-option:hover{border-color:var(--teal);background:var(--safe-bg)}
.q-option.selected{border-color:var(--teal);background:var(--safe-bg);font-weight:600}
.q-option input[type=radio],.q-option input[type=checkbox]{margin-top:3px;accent-color:var(--teal)}
.q-option-label{flex:1}
/* Multi-select note */
.multi-note{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
/* Navigation buttons */
.nav-buttons{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;justify-content:space-between}
button.act{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;padding:10px 16px;border-radius:4px;border:1.5px solid var(--teal-deep);background:var(--teal-deep);color:var(--cream);cursor:pointer}
button.act.secondary{background:transparent;color:var(--teal-deep)}
button.act:hover{opacity:.85}
button.act:disabled{opacity:.4;cursor:not-allowed}
/* Results */
.results-panel{display:none}
.results-panel.active{display:block}
.overall-score{background:var(--teal-deep);color:var(--cream);border-radius:8px;padding:24px 20px;margin:20px 0;position:relative;overflow:hidden}
.overall-score::before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(146,185,59,.3),transparent 70%)}
.overall-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9FC3AE;margin-bottom:4px}
.overall-value{font-family:'Fraunces',serif;font-size:48px;font-weight:700;line-height:1;position:relative}
.overall-risk{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;margin-top:8px;position:relative}
.overall-desc{margin-top:14px;padding-top:14px;border-top:1px solid rgba(245,247,240,.2);font-size:14px;line-height:1.5;position:relative}
.cat-result{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:10px}
.cat-result-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer}
.cat-result-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--teal-deep)}
.badge{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:3px 9px;border-radius:16px;white-space:nowrap}
.badge.b-danger{background:var(--danger-bg);color:var(--danger)}
.badge.b-warn{background:var(--warn-bg);color:var(--warn)}
.badge.b-safe{background:var(--safe-bg);color:var(--safe)}
.badge.b-monitor{background:var(--monitor-bg);color:var(--monitor)}
.badge.b-info{background:var(--info-bg);color:var(--info)}
.cat-result-bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.cat-result-fill{height:100%;border-radius:3px;transition:width .6s ease}
.cat-result-details{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:none}
.cat-result-details.open{display:block}
.reco-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
.reco-item:last-child{border-bottom:none}
.reco-item .reco-icon{margin-right:6px}
.reco-item strong{color:var(--teal-deep)}
/* Radar chart */
.chart-wrap{text-align:center;margin:24px 0}
.chart-wrap svg{max-width:400px;width:100%}
/* Legal */
.legal-section{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:16px 18px;margin-top:32px;font-size:12px;line-height:1.5;color:var(--ink-soft)}
.legal-section .legal-title{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--teal-deep);margin-bottom:8px}
.legal-section p{margin:6px 0}
.legal-section a{color:var(--teal);text-decoration:none}
.legal-section a:hover{text-decoration:underline}
footer{margin-top:36px;padding-top:12px;border-top:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* EU badge */
.eu-flag{display:inline-block;width:20px;height:14px;background:#003399;border-radius:1px;position:relative;vertical-align:middle;margin-right:4px}
/* Responsive */
@media(max-width:600px){.cat-nav{gap:0}.cat-btn{padding:8px 8px 6px;font-size:9px}.datos{grid-template-columns:1fr}}
@media print{.topbar,.cat-nav,.nav-buttons,.lang-wrap,.progress-wrap{display:none}.cat-panel,.results-panel{display:block!important}}
/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cat-panel.active,.results-panel.active{animation:fadeIn .3s ease}
/* Score gauge */
.gauge-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:20px 0}
.gauge-card{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:14px;text-align:center}
.gauge-card .g-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.gauge-card .g-value{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--teal-deep)}
.gauge-card .g-sub{font-size:11px;color:var(--ink-soft);margin-top:2px}
@media(max-width:600px){.gauge-row{grid-template-columns:1fr}}
</style>
</head>

    {q:"Des bottes/couvre-chaussures dédiés ou des bains de pieds désinfectants sont-ils disponibles aux points d'entrée ?", h:"La contamination par les pieds est une voie de transmission importante pour des agents pathogènes comme la gourme et l'HVE.", opts:[{t:"Bains de pieds désinfectants et/ou couvre-chaussures disponibles et utilisés à tous les points d'entrée",s:3},{t:"Disponibles uniquement à l'entrée principale",s:2},{t:"Disponibles mais pas régulièrement entretenus ou utilisés",s:1},{t:"Non disponibles",s:0}]},

  [

    {q:"Existe-t-il un programme de lutte contre les rongeurs ?", h:"Les rongeurs peuvent contaminer les aliments et l'eau et propager des maladies comme la leptospirose.", opts:[{t:"Lutte antiparasitaire professionnelle avec surveillance régulière et postes d'appâtage",s:3},{t:"Postes d'appâtage ou pièges gérés en interne",s:2},{t:"Mesures occasionnelles",s:1},{t:"Aucune lutte contre les rongeurs",s:0}]},
    {q:"Comment les aliments sont-ils stockés pour éviter la contamination par les nuisibles, les oiseaux ou la faune sauvage ?", h:"Les aliments contaminés sont une source de salmonelles, de clostridies et d'autres agents pathogènes.", opts:[{t:"Local à aliments dédié et scellé, stockage surélevé, contenants anti-nuisibles",s:3},{t:"Local à aliments dédié, mais non entièrement scellé",s:2},{t:"Zone de stockage ouverte avec une certaine protection",s:1},{t:"Aliments stockés dans des zones ouvertes accessibles à la faune sauvage",s:0}]}

    {q:"Le matériel de pansage, le harnachement et l'équipement sont-ils partagés entre les chevaux ?", h:"L'équipement partagé peut propager des maladies de peau, l'HVE et la gourme.", opts:[{t:"Chaque cheval dispose de son propre équipement, jamais partagé",s:3},{t:"Principalement individuel, quelques éléments partagés mais nettoyés entre les utilisations",s:2},{t:"Équipement fréquemment partagé, parfois nettoyé",s:1},{t:"Équipement systématiquement partagé sans nettoyage",s:0}]},

    {q:"Comment le fumier est-il géré et éliminé ?", h:"Une bonne gestion du fumier réduit la contamination des pâturages par les parasites et les agents pathogènes.", opts:[{t:"Compostage dans une zone dédiée éloignée des pâturages, évacué régulièrement",s:3},{t:"Collecté et stocké dans une zone désignée",s:2},{t:"Entassé près des paddocks/pâturages",s:1},{t:"Épandu directement sur les pâturages utilisés par les chevaux",s:0}]}

    {q:"Existe-t-il un plan d'intervention d'urgence écrit en cas d'épidémie ?", h:"Un plan de gestion d'épidémie garantit une réponse coordonnée — essentiel lors d'événements de maladies à déclaration obligatoire selon la loi sur la santé animale de l'UE.", opts:[{t:"Oui — plan écrit avec rôles, numéros de contact, procédures d'isolement et protocoles de notification",s:3},{t:"Un plan de base existe",s:2},{t:"Pas de plan écrit mais des connaissances informelles",s:1},{t:"Aucun plan d'épidémie",s:0}]},

de:{appTitle:"Biosicherheits-Risiko-Rechner",lang:"Sprache",introHTML:`Dieser <strong>Biosicherheits-Risiko-Rechner</strong> ist ein Selbstbewertungsinstrument für Pferdebetriebe. <strong>Er ersetzt keine professionelle tierärztliche Beratung.</strong><br><br>Basierend auf dem <strong>EU-Tiergesundheitsrecht (Verordnung 2016/429)</strong> und inspiriert vom <a href="https://thehorseportal.ca/biosecurity-risk-calculator-tool/personalized-biosecurity-risk-calculator/" target="_blank">Biosecurity Risk Calculator der Universität Guelph</a>.`,facilityTitle:"📋 Betriebsinformationen",facName:"Betriebsname",facType:"Betriebstyp",facHorses:"Anzahl der Pferde",facCountry:"Land",facDate:"Bewertungsdatum",facAssessor:"Bewerter",progress:"Fortschritt",section:"Abschnitt",resultsTitle:"📊 Bewertungsergebnisse",overallLabel:"Gesamtbewertung der Biosicherheit",riskHigh:"Hohes Risiko",riskMedHigh:"Mittel-Hohes Risiko",riskMedium:"Mittleres Risiko",riskLow:"Niedriges Risiko",totalScore:"Gesamtpunktzahl",catCompleted:"Kategorien",questionsAnswered:"Fragen",showDetails:"Klicken Sie für Empfehlungen",btnNext:"Weiter →",btnPrev:"← Zurück",btnResults:"📊 Ergebnisse",btnPDF:"📄 PDF-Bericht",btnReset:"🔄 Zurücksetzen",selectMultiple:"Alle zutreffenden auswählen",pdfTitle:"Biosicherheits-Risikobewertungsbericht",pdfGenerated:"Bericht erstellt am",pdfFacility:"Betrieb",recommendations:"Empfehlungen",footerRef:"Inspiriert von der Universität Guelph · Angepasst an EU-Verordnung 2016/429",legalHTML:`<div class="legal-title">⚖️ Rechtlicher Hinweis</div><p>Dieses Tool dient <strong>ausschließlich Bildungs- und Informationszwecken</strong>.</p><p>🔒 Diese Anwendung erhebt keine personenbezogenen Daten.</p><p>Entwickelt im Rahmen des <strong>EUnetHorse</strong>-Projekts (Horizon Europe #101086551). © 2023–2027 <a href="https://www.eunethorse.eu" target="_blank">EUnetHorse</a> · <a href="https://www.ceteca.net" target="_blank">CTC</a></p>`,facTypes:["Reitschule / Reitzentrum","Zuchtbetrieb / Gestüt","Pensionsstall","Turnierstall","Rennstall","Rettung / Rehabilitation","Privatstall","Andere"],countries:["Belgien","Deutschland","Finnland","Frankreich","Irland","Italien","Niederlande","Österreich","Polen","Portugal","Rumänien","Spanien","Andere EU","Nicht-EU"],cats:[{name:"Allgemeiner Betrieb",icon:"🏠"},{name:"Unterbringung & Infrastruktur",icon:"🏗️"},{name:"Pferdebewegungen",icon:"🚛"},{name:"Neuzugänge",icon:"🐴"},{name:"Gesundheit & Impfung",icon:"💉"},{name:"Besucher & Personal",icon:"👥"},{name:"Schädlingsbekämpfung",icon:"🐀"},{name:"Hygiene & Desinfektion",icon:"🧼"},{name:"Krankheitsreaktion",icon:"🩺"},{name:"Isolierung & Quarantäne",icon:"🔒"}],questions:[
[

{q:"Wie viele Pferde sind typischerweise in Ihrem Betrieb untergebracht?",h:"Größere Betriebe haben komplexere Anforderungen an die Bioseküherheit.",opts:[{t:"1–5 Pferde",s:3},{t:"6–15 Pferde",s:2},{t:"16–30 Pferde",s:1},{t:"Mehr als 30 Pferde",s:0}]},
{q:"Gibt es in Ihrem Betrieb eine benannte Person, die für Biosecurity/Seuchenprävention verantwortlich ist?",h:"Die EU-Verordnung 2016/429 verlangt von Tierhaltern, Verantwortung für die Tiergesundheit zu übernehmen.",opts:[{t:"Ja, mit schriftlichen Protokollen",s:3},{t:"Ja, aber ohne formelle Protokolle",s:2},{t:"Nein, aber der Besitzer kümmert sich informell darum",s:1},{t:"Keine benannte Person",s:0}]},

],
[

],

it:{appTitle:"Calcolatore del Rischio di Biosicurezza",lang:"Lingua",introHTML:`Questo <strong>Calcolatore del Rischio di Biosicurezza</strong> è uno strumento di autovalutazione per le strutture equine. <strong>Non sostituisce la consulenza veterinaria professionale.</strong><br><br>Basato sul <strong>Regolamento UE 2016/429</strong> e ispirato al <a href="https://thehorseportal.ca/biosecurity-risk-calculator-tool/personalized-biosecurity-risk-calculator/" target="_blank">Calcolatore dell'Università di Guelph</a>.`,facilityTitle:"📋 Informazioni sulla struttura",facName:"Nome struttura",facType:"Tipo di struttura",facHorses:"Numero di cavalli",facCountry:"Paese",facDate:"Data di valutazione",facAssessor:"Valutatore",progress:"Progresso",section:"Sezione",resultsTitle:"📊 Risultati della valutazione",overallLabel:"Punteggio complessivo di biosicurezza",riskHigh:"Rischio Alto",riskMedHigh:"Rischio Medio-Alto",riskMedium:"Rischio Medio",riskLow:"Rischio Basso",totalScore:"Punteggio totale",catCompleted:"Categorie",questionsAnswered:"Domande",showDetails:"Clicca per le raccomandazioni",btnNext:"Avanti →",btnPrev:"← Indietro",btnResults:"📊 Risultati",btnPDF:"📄 Scarica PDF",btnReset:"🔄 Resetta",selectMultiple:"Seleziona tutte le risposte applicabili",pdfTitle:"Rapporto di Valutazione del Rischio di Biosicurezza",pdfGenerated:"Rapporto generato il",pdfFacility:"Struttura",recommendations:"Raccomandazioni",footerRef:"Ispirato dall'Università di Guelph · Adattato al Regolamento UE 2016/429",legalHTML:`<div class="legal-title">⚖️ Avviso Legale</div><p>Questo strumento è fornito <strong>esclusivamente a scopo educativo e informativo</strong>.</p><p>🔒 Questa applicazione non raccoglie dati personali.</p><p>Sviluppato nell'ambito del progetto <strong>EUnetHorse</strong> (Horizon Europe #101086551). © 2023–2027 <a href="https://www.eunethorse.eu" target="_blank">EUnetHorse</a> · <a href="https://www.ceteca.net" target="_blank">CTC</a></p>`,facTypes:["Scuola di equitazione / Centro ippico","Allevamento","Pensione","Centro di competizione","Scuderia da corsa","Soccorso / Riabilitazione","Scuderia privata","Altro"],countries:["Austria","Belgio","Finlandia","Francia","Germania","Irlanda","Italia","Paesi Bassi","Polonia","Portogallo","Romania","Spagna","Altro UE","Extra UE"],cats:[{name:"Struttura Generale",icon:"🏠"},{name:"Alloggio e Infrastruttura",icon:"🏗️"},{name:"Movimenti dei Cavalli",icon:"🚛"},{name:"Ingresso Nuovi Cavalli",icon:"🐴"},{name:"Salute e Vaccinazione",icon:"💉"},{name:"Visitatori e Personale",icon:"👥"},{name:"Controllo dei Parassiti",icon:"🐀"},{name:"Igiene e Disinfezione",icon:"🧼"},{name:"Risposta alle Malattie",icon:"🩺"},{name:"Isolamento e Quarantena",icon:"🔒"}],questions:[

// ========== APP STATE ==========
let lang = 'en';
let currentCat = 0;
let answers = {}; // answers[catIdx][qIdx] = score or [scores]

function t(key) { return (T[lang] && T[lang][key]) || T.en[key] || key; }
function getQuestions() { return (T[lang] && T[lang].questions) || T.en.questions; }
function getCats() { return (T[lang] && T[lang].cats) || T.en.cats; }

// ========== INIT ==========
function init() {
  document.getElementById('facDate').valueAsDate = new Date();
  applyLang();
}

function applyLang() {
  const L = T[lang] || T.en;
  document.getElementById('appTitle').textContent = t('appTitle');
  document.getElementById('lblLang').textContent = t('lang');
  document.getElementById('introCard').innerHTML = t('introHTML');
  document.getElementById('facilityTitle').innerHTML = t('facilityTitle');
  document.getElementById('lblFacName').textContent = t('facName');
  document.getElementById('lblFacType').textContent = t('facType');
  document.getElementById('lblFacHorses').textContent = t('facHorses');
  document.getElementById('lblFacCountry').textContent = t('facCountry');
  document.getElementById('lblFacDate').textContent = t('facDate');
  document.getElementById('lblFacAssessor').textContent = t('facAssessor');
  document.getElementById('progressLabel').textContent = t('progress');
  document.getElementById('resultsTitle').innerHTML = t('resultsTitle');
  document.getElementById('btnPDF').textContent = t('btnPDF');
  document.getElementById('btnReset').textContent = t('btnReset');
  document.getElementById('legalSection').innerHTML = t('legalHTML');
  document.getElementById('footerRef').textContent = t('footerRef');

  // Facility type options
  const facTypeSelect = document.getElementById('facType');
  const currentFT = facTypeSelect.value;
  facTypeSelect.innerHTML = '<option value="">—</option>';
  (L.facTypes || T.en.facTypes).forEach(ft => {
    const o = document.createElement('option'); o.value = ft; o.textContent = ft;
    facTypeSelect.appendChild(o);
  });
  facTypeSelect.value = currentFT;

  // Countries
  const facCountrySelect = document.getElementById('facCountry');
  const currentFC = facCountrySelect.value;
  facCountrySelect.innerHTML = '<option value="">—</option>';
  (L.countries || T.en.countries).forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c;
    facCountrySelect.appendChild(o);
  });
  facCountrySelect.value = currentFC;

  buildCatNav();
  buildCatPanels();
  updateProgress();
}

function buildCatNav() {
  const nav = document.getElementById('catNav');
  nav.innerHTML = '';
  const cats = getCats();
  cats.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (i === currentCat ? ' active' : '');
    // Check if category is complete
    const qs = getQuestions()[i];
    const allAnswered = qs && qs.every((_, qi) => answers[i] && answers[i][qi] !== undefined);
    if (allAnswered) btn.classList.add('done');
    btn.innerHTML = `<span class="cat-icon">${cat.icon}</span> ${cat.name}${allAnswered ? ' <span class="cat-check">✓</span>' : ''}`;
    btn.onclick = () => { currentCat = i; buildCatNav(); showCatPanel(i); };
    nav.appendChild(btn);
  });
  // Results button
  const rbtn = document.createElement('button');
  rbtn.className = 'cat-btn' + (currentCat === -1 ? ' active' : '');
  rbtn.innerHTML = '📊';
  rbtn.onclick = () => showResults();
  nav.appendChild(rbtn);
}

function buildCatPanels() {
  const container = document.getElementById('catPanels');
  container.innerHTML = '';
  const questions = getQuestions();
  const cats = getCats();

  questions.forEach((catQs, ci) => {
    const panel = document.createElement('div');
    panel.className = 'cat-panel' + (ci === currentCat ? ' active' : '');
    panel.id = 'catPanel' + ci;

    let html = `<div class="section-title">${cats[ci].icon} ${t('section')} ${ci+1}/10 — ${cats[ci].name}</div>`;

    catQs.forEach((q, qi) => {
      const isAnswered = answers[ci] && answers[ci][qi] !== undefined;
      html += `<div class="question-card${isAnswered ? ' answered' : ''}" id="qcard_${ci}_${qi}">`;
      html += `<div class="q-number">${t('section')} ${ci+1} · Q${qi+1}</div>`;
      html += `<div class="q-text">${q.q}</div>`;
      if (q.h) html += `<div class="q-help">${q.h}</div>`;
      if (q.multi) html += `<div class="multi-note">☑ ${t('selectMultiple')}</div>`;
      html += `<div class="q-options">`;
      q.opts.forEach((opt, oi) => {
        const inputType = q.multi ? 'checkbox' : 'radio';
        const name = `q_${ci}_${qi}`;
        const checked = q.multi
          ? (answers[ci] && answers[ci][qi] && answers[ci][qi].includes(oi) ? 'checked' : '')
          : (answers[ci] && answers[ci][qi] === oi ? 'checked' : '');
        const selectedClass = checked ? ' selected' : '';
        html += `<label class="q-option${selectedClass}" id="opt_${ci}_${qi}_${oi}">`;
        html += `<input type="${inputType}" name="${name}" value="${oi}" ${checked} onchange="handleAnswer(${ci},${qi},${oi},${q.multi || false})">`;
        html += `<span class="q-option-label">${opt.t}</span></label>`;
      });
      html += `</div></div>`;
    });

    // Nav buttons
    html += `<div class="nav-buttons">`;
    if (ci > 0) html += `<button class="act secondary" onclick="goToCat(${ci-1})">${t('btnPrev')}</button>`;
    else html += `<span></span>`;
    if (ci < 9) html += `<button class="act" onclick="goToCat(${ci+1})">${t('btnNext')}</button>`;
    else html += `<button class="act" onclick="showResults()">${t('btnResults')}</button>`;
    html += `</div>`;

    panel.innerHTML = html;
    container.appendChild(panel);
  });
}

function showCatPanel(idx) {
  currentCat = idx;
  document.querySelectorAll('.cat-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('catPanel' + idx).classList.add('active');
  document.getElementById('resultsPanel').classList.remove('active');
  buildCatNav();
  window.scrollTo({top: document.getElementById('catNav').offsetTop - 10, behavior: 'smooth'});
}

function goToCat(idx) {
  showCatPanel(idx);
}

function handleAnswer(ci, qi, oi, multi) {
  if (!answers[ci]) answers[ci] = {};
  if (multi) {
    if (!Array.isArray(answers[ci][qi])) answers[ci][qi] = [];
    const idx = answers[ci][qi].indexOf(oi);
    if (idx > -1) answers[ci][qi].splice(idx, 1);
    else answers[ci][qi].push(oi);
    // If "none" (last option with score 0) selected, deselect others
    const q = getQuestions()[ci][qi];
    if (q.opts[oi].s === 0 && answers[ci][qi].includes(oi)) {
      answers[ci][qi] = [oi];
    } else {
      // Remove "none" option if other selected
      const noneIdx = q.opts.findIndex(o => o.s === 0);
      if (noneIdx > -1 && oi !== noneIdx) {
        answers[ci][qi] = answers[ci][qi].filter(x => x !== noneIdx);
      }
    }
  } else {
    answers[ci][qi] = oi;
  }
  // Rebuild to update styles
  buildCatPanels();
  showCatPanel(currentCat);
  updateProgress();
  buildCatNav();
}

function updateProgress() {
  const questions = getQuestions();
  let total = 0, answered = 0;
  questions.forEach((catQs, ci) => {
    catQs.forEach((_, qi) => {
      total++;
      if (answers[ci] && answers[ci][qi] !== undefined) {
        if (Array.isArray(answers[ci][qi]) && answers[ci][qi].length === 0) return;
        answered++;
      }
    });
  });
  const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
}

// ========== SCORING ==========
function calcScores() {
  const questions = getQuestions();
  const catScores = [];
  let totalScore = 0, totalMax = 0;

  questions.forEach((catQs, ci) => {
    let catScore = 0, catMax = 0;
    catQs.forEach((q, qi) => {
      if (q.multi) {
        // Multi: sum selected scores, max = sum of all positive scores
        const maxPossible = q.opts.reduce((s, o) => s + (o.s > 0 ? o.s : 0), 0);
        catMax += maxPossible;
        if (answers[ci] && Array.isArray(answers[ci][qi])) {
          answers[ci][qi].forEach(oi => { catScore += q.opts[oi].s; });
        }
      } else {
        catMax += 3; // Max score per question is 3
        if (answers[ci] && answers[ci][qi] !== undefined) {
          catScore += q.opts[answers[ci][qi]].s;
        }
      }
    });
    const pct = catMax > 0 ? Math.round((catScore / catMax) * 100) : 0;
    catScores.push({score: catScore, max: catMax, pct});
    totalScore += catScore;
    totalMax += catMax;
  });

  const overallPct = totalMax > 0 ? Math.round((totalScore / totalMax) * 100) : 0;
  return {catScores, totalScore, totalMax, overallPct};
}

function getRiskLevel(pct) {
  if (pct >= 75) return {level: 'low', color: 'var(--safe)', badge: 'b-safe', label: t('riskLow')};
  if (pct >= 50) return {level: 'medium', color: 'var(--monitor)', badge: 'b-monitor', label: t('riskMedium')};
  if (pct >= 25) return {level: 'medHigh', color: 'var(--warn)', badge: 'b-warn', label: t('riskMedHigh')};
  return {level: 'high', color: 'var(--danger)', badge: 'b-danger', label: t('riskHigh')};
}

    // Show per-question feedback
    const qs = questions[i];
    qs.forEach((q, qi) => {

      if (answers[i] && answers[i][qi] !== undefined) {
        if (q.multi && Array.isArray(answers[i][qi])) {
          chosen = answers[i][qi].map(oi => q.opts[oi].t).join(', ');
          answers[i][qi].forEach(oi => { score += q.opts[oi].s; });
        } else {
          chosen = q.opts[answers[i][qi]].t;
          score = q.opts[answers[i][qi]].s;
        }
      }
      const qRisk = getRiskLevel(maxS > 0 ? (score/maxS)*100 : 0);
      html += `<div class="reco-item"><span class="reco-icon">${score >= maxS*0.75 ? '✅' : score >= maxS*0.5 ? '⚠️' : '🔴'}</span>
        <strong>Q${qi+1}:</strong> ${q.q}<br>

    });

}

function toggleDetails(i) {
  const el = document.getElementById('catDetails' + i);
  el.classList.toggle('open');
}

// ========== RADAR CHART ==========
function buildRadarChart(catScores, cats) {
  const wrap = document.getElementById('radarWrap');
  const cx = 200, cy = 200, r = 150;
  const n = catScores.length;
  const angleStep = (2 * Math.PI) / n;

  let svg = `<svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">`;
  // Grid circles
  [0.25, 0.5, 0.75, 1].forEach(f => {
    svg += `<circle cx="${cx}" cy="${cy}" r="${r*f}" fill="none" stroke="#D9E0D0" stroke-width="0.5"/>`;
  });
  // Grid lines and labels
  cats.forEach((cat, i) => {
    const angle = -Math.PI/2 + i * angleStep;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D9E0D0" stroke-width="0.5"/>`;
    const lx = cx + (r + 20) * Math.cos(angle);
    const ly = cy + (r + 20) * Math.sin(angle);
    const anchor = Math.abs(Math.cos(angle)) < 0.1 ? 'middle' : Math.cos(angle) > 0 ? 'start' : 'end';
    svg += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="8" font-family="JetBrains Mono,monospace" fill="#4E6459" dominant-baseline="middle">${cat.icon}</text>`;
  });
  // Data polygon
  let points = '';
  catScores.forEach((cs, i) => {
    const angle = -Math.PI/2 + i * angleStep;
    const v = (cs.pct / 100) * r;
    points += `${cx + v * Math.cos(angle)},${cy + v * Math.sin(angle)} `;
  });
  svg += `<polygon points="${points}" fill="rgba(0,117,95,0.2)" stroke="#00755F" stroke-width="2"/>`;
  // Data points
  catScores.forEach((cs, i) => {
    const angle = -Math.PI/2 + i * angleStep;
    const v = (cs.pct / 100) * r;
    const risk = getRiskLevel(cs.pct);
    svg += `<circle cx="${cx + v * Math.cos(angle)}" cy="${cy + v * Math.sin(angle)}" r="4" fill="${risk.color}" stroke="white" stroke-width="1.5"/>`;
  });
  svg += `</svg>`;
  wrap.innerHTML = svg;
}

  document.getElementById('facCountry').value = '';
